name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history so the historical-artifact guard can resolve the trunk
          # merge-base; a shallow single-branch checkout has no origin/main.
          fetch-depth: 0

      - name: Fetch trunk ref for the historical-artifact baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Install deterministic packaging npm CLI
        run: npm install --global --ignore-scripts npm@11.5.1

      - name: Build generated host adapters
        run: npm run build:adapters

      - name: Reject generated adapter drift
        run: npm run test:generated

      - name: Validate skill metadata and description budget
        run: npm run test:skills

      - name: Validate cross-host contracts and manifests
        run: npm run test:platforms

      - name: Validate routing policy
        run: npm run test:routing

      - name: Test GitHub-first project context runtime
        run: npm run test:project-context

      - name: Test project-registry contract runtime
        run: npm run test:project-registry

      - name: Test regression auto-judge harness
        run: npm run test:regression-judge

      - name: Test cross-review runtime
        run: npm run test:cross-review

      - name: Test profile composition contract
        run: npm run test:profiles

      - name: Test destructive-command guard
        run: npm run test:hooks

      - name: Validate Mermaid compatibility
        run: npm run test:mermaid

      - name: Test token benchmark summarizer
        run: npm run test:token-benchmark

      - name: Test deterministic release contracts
        run: npm run test:release

      - name: Reject whitespace errors
        run: git diff --check
